name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.checksum.outputs.md5 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: |
          dotnet publish Jellyfin.Plugin.TorrentSearch.csproj \
            -c Release \
            -o ./publish

      - name: Package zip
        run: |
          cp meta.json ./publish/meta.json
          rm -f ./publish/Jellyfin.Plugin.TorrentSearch.pdb
          cd ./publish
          zip -r ../Jellyfin.Plugin.TorrentSearch_${{ github.event.release.tag_name }}.zip ./*

      - name: Compute checksum
        id: checksum
        run: |
          echo "md5=$(md5sum Jellyfin.Plugin.TorrentSearch_${{ github.event.release.tag_name }}.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            Jellyfin.Plugin.TorrentSearch_${{ github.event.release.tag_name }}.zip \
            --clobber

  update-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update manifest.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          CHECKSUM="${{ needs.release.outputs.md5 }}"
          ZIP="Jellyfin.Plugin.TorrentSearch_${{ github.event.release.tag_name }}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$ZIP"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > manifest.json <<EOF
          [
            {
              "name": "Torrent Search",
              "description": "Search for movies and TV shows via Jackett/Prowlarr, download via qBittorrent or embedded MonoTorrent, and auto-sync to Jellyfin library",
              "overview": "Search for movies and TV shows via Jackett/Prowlarr, download via qBittorrent or embedded MonoTorrent, and auto-sync to Jellyfin library",
              "owner": "alphingj",
              "category": "Metadata",
              "guid": "8b9e2c4d-7f3a-4d5e-9c1b-2a8f6e4d3c7a",
              "versions": [
                {
                  "version": "${VERSION}",
                  "targetAbi": "10.11.0.0",
                  "sourceUrl": "${URL}",
                  "checksum": "${CHECKSUM}",
                  "timestamp": "${TIMESTAMP}"
                }
              ]
            }
          ]
          EOF

      - name: Commit & Push manifest
        run: |
          git add manifest.json
          git diff --cached --quiet || git commit -m "Update manifest for ${{ github.event.release.tag_name }}"
          git push
